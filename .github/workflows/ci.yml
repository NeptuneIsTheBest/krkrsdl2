{
  "name": "Continuous Integration",
  "on": {
    "push": {
      "paths": [
        "**.c",
        "**.h",
        "**.cpp",
        "**.hpp",
        "**.in",
        "**.py",
        "**.yml",
        "**.cmake",
        "CMakeLists.txt",
        "src/config/src_list/**",
        "src/resources/**",
        "data/**",
        ".gitmodules",
        "external/**"
      ]
    },
    "pull_request": {
      "paths": [
        "**.c",
        "**.h",
        "**.cpp",
        "**.hpp",
        "**.in",
        "**.py",
        "**.yml",
        "**.cmake",
        "CMakeLists.txt",
        "src/config/src_list/**",
        "src/resources/**",
        "data/**",
        ".gitmodules",
        "external/**"
      ]
    }
  },
  "env": {
    "CMAKE_GENERATOR": "Ninja",
    "HOMEBREW_NO_ANALYTICS": "1",
    "HOMEBREW_NO_AUTO_UPDATE": "1",
    "HOMEBREW_NO_INSTALL_UPGRADE": "1",
    "HOMEBREW_NO_INSTALL_CLEANUP": "1",
    "EXAMPLE_PROJECT_URL": "https://github.com/krkrsdl2/krkrsdl2-kag3-demo/releases/download/latest/data.xp3"
  },
  "jobs": {
    "build-macos-cmake": {
      "runs-on": "macos-14",
      "timeout-minutes": 20,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "appbundle": [
            {
              "enabled": "false",
              "cmakeflags": "-DOPTION_BUILD_MACOS_BUNDLE=OFF",
              "artifactnameappendix": ""
            },
            {
              "enabled": "true",
              "cmakeflags": "-DOPTION_BUILD_MACOS_BUNDLE=ON -DEMBED_DATA_PATH=data.xp3",
              "artifactnameappendix": "-appbundle"
            }
          ]
        }
      },
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v4",
          "with": {
            "submodules": "recursive"
          }
        },
        {
          "name": "Download example project",
          "if": "matrix.appbundle.enabled == 'true'",
          "run": "curl -LOC - $EXAMPLE_PROJECT_URL"
        },
        {
          "name": "Set up default build tools",
          "run": "brew install ninja cmake"
        },
        {
          "name": "Configure project",
          "run": "cmake -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_BUILD_TYPE=Release -S . -B build ${{ matrix.appbundle.cmakeflags }}"
        },
        {
          "name": "Build project",
          "run": "cmake --build build --parallel 3"
        },
        {
          "name": "Archive artifact (command line)",
          "run": "ditto -ck --rsrc --sequesterRsrc build/krkrsdl2 build/${{ github.event.repository.name }}-macos.zip",
          "if": "matrix.appbundle.enabled == 'false'"
        },
        {
          "name": "Archive artifact (app bundle)",
          "run": "ditto -ck --rsrc --sequesterRsrc --keepParent build/krkrsdl2.app build/${{ github.event.repository.name }}-macos-appbundle.zip",
          "if": "matrix.appbundle.enabled == 'true'"
        },
        {
          "name": "Upload artifact",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "${{ github.event.repository.name }}-macos${{ matrix.appbundle.artifactnameappendix }}",
            "path": "build/*.zip"
          }
        }
      ]
    },
    "generate-tp-stub-macos": {
      "runs-on": "macos-14",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v4",
          "with": {
            "submodules": "recursive"
          }
        },
        {
          "name": "Set up build tools",
          "run": "brew install ninja cmake python"
        },
        {
          "name": "Generate plugin SDK",
          "run": "mkdir -p build/${{ github.event.repository.name }}-tp_stub\npython3 src/core/base/sdl2/makestub.py build/${{ github.event.repository.name }}-tp_stub\ncp src/config/tp_stub_template.cmake build/${{ github.event.repository.name }}-tp_stub/CMakeLists.txt"
        },
        {
          "name": "Archive plugin SDK",
          "run": "cd build && tar -czf ${{ github.event.repository.name }}-tp_stub.tar.gz ${{ github.event.repository.name }}-tp_stub"
        },
        {
          "name": "Upload artifact",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "${{ github.event.repository.name }}-tp_stub",
            "path": "build/*.tar.gz"
          }
        }
      ]
    },
    "create-release": {
      "needs": [
        "build-macos-cmake",
        "generate-tp-stub-macos"
      ],
      "runs-on": "ubuntu-latest",
      "container": {
        "image": "ubuntu:20.04",
        "options": "--user 0"
      },
      "timeout-minutes": 20,
      "if": "github.ref == 'refs/heads/main'",
      "steps": [
        {
          "name": "Download all artifacts",
          "uses": "actions/download-artifact@v4"
        },
        {
          "name": "Prepare artifacts for release",
          "run": "cp -t . ${{ github.event.repository.name }}-macos*/*.zip\ncp -t . ${{ github.event.repository.name }}-tp_stub/*.tar.gz\n"
        },
        {
          "name": "Create prerelease",
          "if": "github.ref == 'refs/heads/main'",
          "uses": "marvinpinto/action-automatic-releases@latest",
          "with": {
            "repo_token": "${{ secrets.GITHUB_TOKEN }}",
            "prerelease": "true",
            "automatic_release_tag": "latest",
            "title": "Latest development builds",
            "files": "*.zip\n*.tar.gz\n"
          }
        }
      ]
    }
  }
}
